name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Бэкенд — тесты и эталон
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Tesseract для распознавания сканов
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-rus fonts-dejavu-core
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q -rs
      - name: Эталонный набор (точность ≥ 80%, без критических ошибок)
        run: |
          python -m app.evaluation
          python -c "import json,sys; r=json.load(open('eval/report.json',encoding='utf-8')); print(r.get('accuracy'), r.get('critical_errors')); sys.exit(0 if r['accuracy']>=0.8 and r.get('critical_errors',0)==0 else 1)"

  frontend:
    name: Фронтенд — сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  compose:
    name: docker compose up — запуск на чистой машине
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Сборка и запуск (без скачивания LLM — система работает и без неё)
        run: docker compose up -d --build db redis backend worker frontend
      - name: Ждём готовности API
        run: |
          for i in $(seq 1 60); do
            curl -fs http://localhost:8000/api/health && exit 0
            sleep 5
          done
          docker compose logs backend
          exit 1
      - name: Проверка сценария ТЗ — быстрая оценка реального извещения < 10 с
        run: |
          curl -fs -o sample.xml http://localhost:8000/api/demo/sample.xml
          start=$(date +%s%N)
          curl -fs -X POST http://localhost:8000/api/quick-score \
            -F file=@sample.xml -F inn=5406123450 \
            -F "criteria_text=Поставляем компьютеры и ноутбуки, НМЦК до 200 млн" -o result.json
          ms=$(( ($(date +%s%N) - start) / 1000000 ))
          echo "Время ответа: ${ms} мс"
          python3 -c "import json; r=json.load(open('result.json'))['result']; print(r['score'], r['verdict_name'])"
          test "$ms" -lt 10000
      - name: Интерфейс открывается
        run: curl -fs http://localhost:8080/ | grep -q "<div id=\"root\">"
      - name: Лента заполнена демо-данными (PostgreSQL + pgvector)
        run: curl -fs "http://localhost:8000/api/feed?limit=5" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['total']); assert d['total'] > 0"
      - if: failure()
        run: docker compose logs
